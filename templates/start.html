<!DOCTYPE html>
<html>
  <head>
    <title>Start Game - Wheel of Fortune</title>
    <style>
      body {
        background-color: #0e53a1;
        color: white;
        font-family: "Courier New", monospace;
        text-align: center;
        padding-top: 100px;
      }
      h1 {
        color: goldenrod;
      }
      input {
        padding: 10px;
        margin: 10px;
        border-radius: 5px;
        border: none;
        text-align: center;
      }
      button {
        background-color: #00ffcc;
        border: none;
        padding: 10px 30px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 5px;
      }
      button:hover {
        background-color: #00bbaa;
      }
    </style>
  </head>
  <body>
    <h1>WELCOME TO WHEEL OF FORTUNE</h1>
    <form method="POST">
      <h3>Enter Player Names</h3>
      <input type="text" name="player1" placeholder="Player 1" required /><br />
      <input type="text" name="player2" placeholder="Player 2" required /><br />
      <input
        type="text"
        name="player3"
        placeholder="Player 3"
        required
      /><br /><br />
      <button type="submit">START GAME</button>
    </form>
  </body>
</html>
